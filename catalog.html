<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Website for Ceramic soul brand" />
  <meta name="author" content="Awesome student" />
  <title>Ceramic soul</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
          href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,400;0,500;1,400&display=swap"
          rel="stylesheet"
  />
</head>
<body class="catalog-page">
<div class="burger-menu" id="burgerMenu">
    <div class="burger-menu__close" id="burgerClose">×</div>
    <nav class="burger-menu__nav">
        <a href="catalog.html" class="burger-menu__link">CATALOG</a>
        <a href="blog.html" class="burger-menu__link">BLOG</a>
        <a href="about.html" class="burger-menu__link">ABOUT</a>
    </nav>
</div>
<header class="header">
    <div class="burger" id="burgerBtn"><span></span><span></span><span></span></div>
    <div class="header__brand">
      <a href="index.html" class="header__logo">
        <img src="/src/logo/logo.png" alt="logo" />
      </a>
      <nav class="header__nav">
        <a href="catalog.html" class="header__nav-link">CATALOG</a>
        <a href="blog.html" class="header__nav-link">BLOG</a>
        <a href="about.html" class="header__nav-link">ABOUT</a>
      </nav>
    </div>
    <div class="header__icons">
      <a href="#"><span class="icon-search"></span></a>
      <a href="#"><span class="icon-shopping-bag"></span></a>
    </div>
  </header>
  <section class="catalog">
    <div class="catalog__container">
      <h1 class="catalog__title">Our Pottery</h1>
      
      <div class="catalog__filters">
        <button class="catalog__filter active" data-category="tea">
          For Tea
        </button>
        <button class="catalog__filter" data-category="kitchen">
          For Kitchen
        </button>
        <button class="catalog__filter" data-category="plants">
          For Plants
        </button>
      </div>

        <div class="catalog__grid">
        </div>
    </div>
  </section>

  <footer class="footer">
    <div class="footer__container">
      <div class="footer__content">
        <div class="footer__section footer__newsletter">
          <h3 class="footer__title">Newsletter</h3>
          <p class="footer__description">Keep up to date with news and promotions</p>
          <form class="footer__form">
            <input type="email" class="footer__input" placeholder="Enter your e-mail" />
            <div class="footer__checkbox">
              <input type="checkbox" id="footer-terms" class="footer__checkbox-input" />
              <label for="footer-terms" class="footer__checkbox-label">
                I agree with the <a href="#" class="footer__link-terms">terms</a>
              </label>
            </div>
            <button type="submit" class="footer__submit">Submit</button>
          </form>
        </div>

        <div class="footer__section">
          <h3 class="footer__title">Discover</h3>
          <nav class="footer__nav">
            <a href="#" class="footer__link">About Us</a>
            <a href="#" class="footer__link">Blog</a>
          </nav>
        </div>

        <div class="footer__section">
          <h3 class="footer__title">Shopping</h3>
          <nav class="footer__nav">
            <a href="catalog.html" class="footer__link">Catalog</a>
          </nav>
        </div>

        <div class="footer__section">
          <h3 class="footer__title">Information</h3>
          <nav class="footer__nav">
            <a href="#" class="footer__link">Terms and Conditions</a>
          </nav>
        </div>

        <div class="footer__section">
          <h3 class="footer__title">Follow Us</h3>
          <div class="footer__social">
            <a href="#" class="footer__social-link">
              <span class="icon-facebook"></span>
            </a>
            <a href="#" class="footer__social-link">
              <span class="icon-instagram"></span>
            </a>
            <a href="#" class="footer__social-link">
              <span class="icon-pinterest-circled"></span>
            </a>
          </div>
        </div>
      </div>

      <div class="footer__copyright">
        <p>© Copyright 2025, Ceramic soul</p>
      </div>
    </div>
  </footer>
<script type="module" src="/src/js/script.js"></script>
<script type="module" src="/src/js/burger-menu.js"></script>
<script type="module" src="/src/js/products.js"></script>
</body>
</html>
